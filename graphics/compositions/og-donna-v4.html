<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=630" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1200px; height: 630px; overflow: hidden;
        background: var(--surface-base);
        font-family: var(--font-text);
      }

      .bg { position: absolute; inset: 0; background: var(--surface-base); }
      .glow {
        position: absolute; top: 46%; left: 6%;
        width: 760px; height: 760px; transform: translate(-50%, -50%);
        border-radius: 9999px;
        background: radial-gradient(circle,
          color-mix(in srgb, var(--brand) 17%, transparent) 0%, transparent 70%);
      }

      .stage {
        position: absolute; inset: 0; z-index: 2;
        padding: 56px 60px;
        display: flex; align-items: center; gap: 46px;
      }

      /* ---------- LEFT: editorial billing ---------- */
      .billing { flex: 0 0 420px; }

      .kicker {
        font-size: 24px; font-weight: var(--fw-bold);
        letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--brand-ink);
        margin-bottom: 26px;
      }

      .title {
        font-size: 68px; line-height: 1.03;
        font-weight: var(--fw-bold); letter-spacing: -0.02em;
        color: var(--ink-gray-9);
      }

      .deck {
        margin-top: 26px;
        font-size: 27px; line-height: 1.4; font-weight: var(--fw-medium);
        color: var(--ink-gray-6);
      }

      /* ---------- divider ---------- */
      .divider {
        flex: 0 0 2px; align-self: stretch; margin: 22px 0;
        background: linear-gradient(to bottom,
          transparent 0%,
          color-mix(in srgb, var(--brand) 70%, transparent) 30%,
          color-mix(in srgb, var(--brand) 70%, transparent) 70%,
          transparent 100%);
      }

      /* ---------- RIGHT: chat panel ---------- */
      .panel {
        flex: 1 1 auto;
        background: var(--surface-gray-1);
        border: 1px solid var(--surface-gray-3);
        border-radius: 36px;
        padding: 34px 30px;
        display: flex; flex-direction: column; gap: 24px;
      }

      .row { display: flex; align-items: flex-end; gap: 16px; }
      .row.me { justify-content: flex-end; }

      .avatar {
        width: 78px; height: 78px; border-radius: 9999px; flex: none;
        overflow: hidden; background: var(--surface-gray-2);
        border: 2px solid var(--surface-gray-3);
      }
      .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .avatar.hussain img { object-position: 58% 44%; transform: scale(1.12); }
      .avatar.donna img { transform: scale(1.16) translate(0, -2%); }

      .bubble {
        max-width: 414px;
        font-size: 35px; line-height: 1.22; font-weight: var(--fw-semibold);
        padding: 20px 26px; border-radius: 26px;
      }
      .bubble.me {
        background: var(--brand); color: #fff;
        border-bottom-right-radius: 8px;
      }
      .bubble.donna {
        background: var(--surface-gray-2); color: var(--ink-gray-9);
        border: 1px solid var(--surface-gray-3);
        border-bottom-left-radius: 8px;
      }
      .bubble .done {
        display: block; color: var(--brand-ink); font-weight: var(--fw-bold);
      }
      .bubble .sub {
        display: block; margin-top: 10px;
        font-size: 26px; font-weight: var(--fw-medium); color: var(--ink-gray-6);
      }
    </style>
  </head>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1"
         data-fps="30" data-width="1200" data-height="630">
      <div class="bg"><div class="glow"></div></div>

      <div class="stage">
        <div class="billing">
          <div class="kicker">OpenClaw &times; ERPNext</div>
          <h1 class="title">Your AI<br />accountant,<br />on Telegram</h1>
          <p class="deck">Donna keeps the books.<br />I just check in.</p>
        </div>

        <div class="divider"></div>

        <div class="panel">
          <div class="row me">
            <div class="bubble me">Razorpay settled?</div>
            <div class="avatar hussain">
              <img src="assets/img/hussain-avatar.png" alt="" />
            </div>
          </div>

          <div class="row">
            <div class="avatar donna">
              <img src="assets/img/donna-face.png" alt="" />
            </div>
            <div class="bubble donna">
              <span class="done">Done &check;</span>All reconciled
              <span class="sub">4 Payment Entries &middot; &#8377;0 left</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

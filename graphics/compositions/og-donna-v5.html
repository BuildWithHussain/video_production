<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=630" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1200px; height: 630px; overflow: hidden;
        background: var(--surface-base);
        font-family: var(--font-text);
      }

      .bg { position: absolute; inset: 0; background: var(--surface-base); }
      .glow {
        position: absolute; bottom: -260px; left: 50%;
        width: 1200px; height: 640px; transform: translateX(-50%);
        border-radius: 9999px;
        background: radial-gradient(ellipse,
          color-mix(in srgb, var(--brand) 24%, transparent) 0%, transparent 68%);
      }

      /* ---- avatars: big, symmetric, bottom corners ---- */
      .face {
        position: absolute; bottom: 30px;
        width: 244px; height: 244px; border-radius: 9999px;
        overflow: hidden; z-index: 3;
        background: var(--surface-gray-2);
        border: 4px solid var(--surface-gray-3);
      }
      .face.donna { left: 44px; }
      /* tucked up under the ask bubble, so each face sits with its own message */
      .face.hussain { right: 62px; bottom: auto; top: 196px; width: 212px; height: 212px; }
      .face img { position: absolute; display: block; }
      /* donna-face.png 880x880 — head centre ≈ (0.51, 0.47) */
      .face.donna img { width: 254px; height: 254px; left: -6px; top: -6px; }
      /* hussain-blog-avatar.png 800x800 — wide framing, no extra zoom */
      .face.hussain img { width: 212px; height: 212px; left: 0; top: 0; }

      /* ---- the conversation across the frame ---- */
      .bubble {
        position: absolute; z-index: 2;
        font-size: 50px; line-height: 1.18; font-weight: var(--fw-semibold);
        padding: 24px 42px; border-radius: var(--radius-9, 40px);
        box-shadow: 0 20px 46px color-mix(in srgb, var(--surface-base) 76%, transparent);
      }
      .bubble.ask {
        top: 58px; right: 62px; white-space: nowrap;
        background: var(--brand); color: #fff;
        border-bottom-right-radius: 12px;
        transform: rotate(1.1deg);
      }
      .bubble.reply {
        top: 176px; left: 60px; max-width: 780px;
        background: var(--surface-gray-2); color: var(--ink-gray-9);
        border: 1px solid var(--surface-gray-3);
        border-bottom-left-radius: 12px;
        transform: rotate(-1.1deg);
      }
      .bubble.reply .done { color: var(--brand-ink); font-weight: var(--fw-bold); }

    </style>
  </head>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1"
         data-fps="30" data-width="1200" data-height="630">
      <div class="bg"><div class="glow"></div></div>

      <div class="bubble ask">Books done for this week?</div>

      <div class="bubble reply">
        <span class="done">Done ✓</span> 12 invoices booked, Razorpay reconciled to ₹0
      </div>

      <div class="face donna"><img src="assets/img/donna-face.png" alt="" /></div>
      <div class="face hussain"><img src="assets/img/hussain-blog-avatar.png" alt="" /></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" data-resolution="landscape" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: var(--surface-base);
        font-family: var(--font-text);
      }
      /* fade colour = the surface, per theme (dark = #171717) */
      :root { --fade-rgb: 255, 255, 255; --dot: rgba(0,0,0,0.06); }

      /* Day 3 accent = green, matching intro-day3.html.
         Scoped to #root (beats [data-theme="light"] on the same element). */
      #root {
        --brand: var(--green-500);
        --brand-hover: var(--green-600);
        --brand-subtle: var(--green-100);
        --brand-ink: var(--green-600);
      }

      .bg { position: absolute; inset: 0; background: var(--surface-base); }
      .dot-grid { position: absolute; inset: 0;
        background-image: radial-gradient(circle, var(--dot) 1.6px, transparent 1.6px);
        background-size: 46px 46px; }

      /* slanted photo split (right) */
      .photo-wrap {
        position: absolute; inset: 0; overflow: hidden;
        clip-path: polygon(1120px 0, 1920px 0, 1920px 1080px, 920px 1080px);
        z-index: 2;
      }
      /* subject photo — anchored so the face sits in the visible right slant.
         Tune --photo-left / --photo-top to reposition. */
      .photo {
        position: absolute; left: var(--photo-left, 300px); top: var(--photo-top, 0px);
        height: 1080px; width: auto; object-fit: cover;
      }
      .photo-fade {
        position: absolute; inset: 0;
        background: linear-gradient(to right,
          rgba(var(--fade-rgb),0.96) 0%,
          rgba(var(--fade-rgb),0.5) 12%,
          transparent 34%);
      }
      .slant-line {
        position: absolute; inset: 0; z-index: 3;
        clip-path: polygon(1117px 0, 1123px 0, 923px 1080px, 917px 1080px);
        background: var(--brand);
      }

      /* left content */
      .content {
        position: absolute; inset: 0; z-index: 4;
        display: flex; align-items: center;
      }
      .content-inner {
        display: flex; flex-direction: column; align-items: flex-start;
        padding-left: 130px; width: 60%;
      }
      .pill {
        font-size: 40px; font-weight: var(--fw-bold);
        letter-spacing: 0.04em;
        color: var(--brand-ink); background: var(--brand-subtle);
        border: 1px solid color-mix(in srgb, var(--brand) 42%, transparent);
        padding: 16px 40px; border-radius: var(--radius-9);
        margin-bottom: 40px;
      }
      .title {
        font-size: 128px; line-height: 0.98;
        font-weight: 800; letter-spacing: -0.03em;
        color: var(--ink-gray-9);
      }
      .title .line { display: block; }
      .title .accent { color: var(--brand-ink); }
      .sub {
        margin-top: 34px;
        font-size: 52px; font-weight: var(--fw-semibold);
        letter-spacing: -0.01em; color: var(--ink-gray-7);
      }
      .sub .accent { color: var(--brand-ink); font-weight: var(--fw-bold); }
    </style>
  </head>
  <body>
    <div id="root" data-theme="light" data-composition-id="main"
         data-start="0" data-duration="1" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="bg">
        <div class="dot-grid"></div>
      </div>

      <div class="photo-wrap">
        <img class="photo" src="assets/img/hussain-agentic.png" alt="" />
        <div class="photo-fade"></div>
      </div>
      <div class="slant-line"></div>

      <div class="content">
        <div class="content-inner">
          <div class="pill">Day 3</div>
          <h1 class="title">
            <span class="line">Agentic</span>
            <span class="line">Development</span>
          </h1>
          <div class="sub">with <span class="accent">Frappe Framework</span></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

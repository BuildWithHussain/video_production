<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=630" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1200px; height: 630px; overflow: hidden;
        background: var(--surface-base);
        font-family: var(--font-text);
      }

      .bg { position: absolute; inset: 0; background: var(--surface-base); }
      .glow {
        position: absolute; top: 340px; left: 230px;
        width: 780px; height: 780px; transform: translate(-50%, -50%);
        border-radius: var(--radius-9);
        background: radial-gradient(circle,
          color-mix(in srgb, var(--brand) 30%, transparent) 0%, transparent 68%);
      }

      .kicker {
        position: absolute; top: 46px; left: 62px; z-index: 3;
        display: flex; align-items: center; gap: 14px;
        font-size: 24px; font-weight: var(--fw-bold);
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--ink-gray-6);
      }
      .kicker .dot {
        width: 11px; height: 11px; border-radius: var(--radius-9);
        background: var(--brand); flex: none;
      }

      .stage {
        position: absolute; left: 62px; right: 62px; top: 118px; bottom: 46px;
        z-index: 2; display: flex; align-items: center; gap: 54px;
      }

      /* ---- hero donna ---- */
      .hero { flex: none; width: 330px; text-align: center; }
      .hero .ring {
        width: 330px; height: 330px; border-radius: var(--radius-9);
        overflow: hidden; background: var(--surface-gray-2);
        border: 5px solid color-mix(in srgb, var(--brand) 55%, transparent);
        box-shadow: 0 0 0 14px color-mix(in srgb, var(--brand) 12%, transparent);
      }
      .hero .ring img {
        width: 100%; height: 100%; object-fit: cover;
        transform: scale(1.06);
      }
      .hero .name {
        margin-top: 30px;
        font-size: 44px; font-weight: var(--fw-bold);
        color: var(--ink-gray-9); letter-spacing: -0.01em;
      }
      .hero .role {
        margin-top: 4px;
        font-size: 24px; font-weight: var(--fw-medium);
        color: var(--ink-gray-6);
      }

      /* ---- chat inset ---- */
      .chat {
        flex: 1; display: flex; flex-direction: column; gap: 26px;
      }
      .row { display: flex; align-items: flex-end; gap: 16px; }
      .row.me { justify-content: flex-end; }

      .ava {
        width: 96px; height: 96px; border-radius: var(--radius-9); flex: none;
        overflow: hidden; background: var(--surface-gray-2);
        border: 3px solid var(--surface-gray-4);
      }
      .ava img {
        width: 100%; height: 100%; object-fit: cover;
        transform: scale(1.46) translate(-6%, 1%);
      }

      .bubble {
        max-width: 548px;
        font-size: 46px; line-height: 1.22; font-weight: var(--fw-semibold);
        padding: 26px 34px; border-radius: 34px;
        letter-spacing: -0.01em;
      }
      .bubble.me {
        max-width: 470px;
        background: var(--brand); color: #fff;
        border-bottom-right-radius: 10px;
      }
      .bubble.donna {
        background: var(--surface-gray-2); color: var(--ink-gray-9);
        border: 1px solid var(--surface-gray-3);
        border-bottom-left-radius: 10px;
      }
      .bubble .done { color: var(--brand-ink); font-weight: var(--fw-bold); }
      .bubble .sub {
        display: block; margin-top: 10px;
        font-size: 30px; font-weight: var(--fw-medium); color: var(--ink-gray-6);
      }
    </style>
  </head>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1"
         data-fps="30" data-width="1200" data-height="630">
      <div class="bg"><div class="glow"></div></div>

      <div class="kicker"><span class="dot"></span>Automating the boring stuff</div>

      <div class="stage">
        <div class="hero">
          <div class="ring"><img src="assets/img/donna-face.png" alt="" /></div>
          <div class="name">Donna</div>
          <div class="role">runs my books in ERPNext</div>
        </div>

        <div class="chat">
          <div class="row me">
            <div class="bubble me">Book the Frappe Cloud invoice</div>
            <div class="ava"><img src="assets/img/hussain-avatar.png" alt="" /></div>
          </div>

          <div class="row">
            <div class="bubble donna">
              <span class="done">Already done ✓</span>
              <span class="sub">PINV-00291 booked · PDF attached</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
